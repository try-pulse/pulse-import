name: release

on:
  push:
    tags:
      # Stable: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-release: v1.2.3-rc.1, v1.2.3-beta.2, …
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          dirs=$(go list -f '{{.Dir}}' ./...)
          test -z "$(gofmt -l $dirs)"

      - name: Vet & test
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=vendor
