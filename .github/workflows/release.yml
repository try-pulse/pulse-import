name: release

on:
  push:
    tags:
      # Stable: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-release: v1.2.3-rc.1, v1.2.3-beta.2, …
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry from main
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.target.outputs.commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the tagged source
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Retrying an older release would move the container's latest tag backwards.
            [[ "$(git describe --first-parent --abbrev=0 --match 'v[0-9]*' HEAD)" == "$RELEASE_TAG" ]]
            git merge-base --is-ancestor "$commit" HEAD
            git checkout --detach "$commit"
          fi
          [[ "$(git rev-parse HEAD)" == "$commit" ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Format
        run: |
          dirs=$(go list -f '{{.Dir}}' ./...)
          test -z "$(gofmt -l $dirs)"

      - name: Vet & test
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Install release binary scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          GOFLAGS: -mod=vendor
