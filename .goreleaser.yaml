version: 2

project_name: pulse-import

before:
  hooks:
    - go mod verify

builds:
  - id: pulse-import
    main: ./cmd/pulse-import
    binary: pulse-import
    flags:
      - -mod=vendor
    ldflags:
      - -s -w
      - -X github.com/try-pulse/pulse-import/internal/version.Version={{.Version}}
      - -X github.com/try-pulse/pulse-import/internal/version.Commit={{.ShortCommit}}
      - -X github.com/try-pulse/pulse-import/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

nfpms:
  - id: pulse-import
    package_name: pulse-import
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/try-pulse/pulse-import
    maintainer: Pulse <security@trypulse.tech>
    description: Import issues into Pulse from external tools (Jira CSV → Pulse)
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    priority: optional

dockers_v2:
  - id: pulse-import
    dockerfile: Dockerfile
    ids:
      - pulse-import
    images:
      - ghcr.io/try-pulse/pulse-import
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ .IsSnapshot }}"
    labels:
      "org.opencontainers.image.title": "pulse-import"
      "org.opencontainers.image.description": "Import issues into Pulse from external tools"
      "org.opencontainers.image.source": "https://github.com/try-pulse/pulse-import"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^Merge pull request"
      - "^Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  make_latest: "{{ if .Prerelease }}false{{ else }}true{{ end }}"
  footer: |
    ## Install

    ```bash
    # Go
    go install github.com/try-pulse/pulse-import/cmd/pulse-import@v{{ .Version }}

    # Or download the archive / .deb / .rpm / .apk from the assets below,
    # extract (or install the package), and put `pulse-import` on your PATH.
    ```

    ```bash
    # Container
    docker pull ghcr.io/try-pulse/pulse-import:{{ .Version }}
    ```

    ```bash
    pulse-import --version
    ```

    **Checksums:** verify downloads against `checksums.txt` (SHA-256).
