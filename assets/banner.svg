  <text x="56" y="132" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700">pulse-import</text>
  <text x="56" y="176" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Import Jira issues into Pulse — cleanly, from a CSV.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="56" y="208" width="118" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
