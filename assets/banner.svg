    <path d="M206 218 L218 226 L206 234" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="226" y="208" width="132" height="36" rx="18" fill="#0C4A6E" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="292" y="231" text-anchor="middle" fill="#E0F2FE" font-size="13">pulse-import</text>

    <path d="M370 226 H398" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M390 218 L402 226 L390 234" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

